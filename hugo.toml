baseURL = "https://amitashukla.in/"
languageCode = "en-us"
title = "Amita Shukla"
theme = "gokarna"

[menu]

  [[menu.main]]
    name = "About"
    url = "/"
    weight = 1

  [[menu.main]]
    name = "Blog"
    url = "/blog/"
    weight = 2

  [[menu.main]]
    name = "Notes"
    url = "/notes/"
    weight = 3

  [[menu.main]]
    name = "Tags"
    url = "/tags/"
    weight = 4

  [[menu.main]]
    name = "Follow"
    url = "/follow/"
    weight = 5

  [[menu.main]]
    name = "Contact"
    url = "/contact/"
    weight = 6


enableGitInfo = true

enableRobotsTXT = true

[outputFormats.SearchIndex]
  mediaType = "application/json"
  baseName = "search-index"
  isPlainText = true
  notAlternative = true

[outputs]
  home = ["HTML", "RSS", "SearchIndex"]

[pagination]
  pagerSize = 10

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.tableOfContents]
    startLevel = 1
    endLevel = 3
    ordered = false

[params]
    socialIcons = [
      {name = "linkedin", url = "https://in.linkedin.com/in/shuklaamita"},
      {name = "github", url = "https://github.com/amita-shukla"},
      {name = "stackoverflow", url = "http://stackoverflow.com/users/3858467/amita"},
      {name = "goodreads", url = "https://www.goodreads.com/amita_shukla"}
    ]
    avatarURL = "/images/avatar.png"
    avatarSize = "size-m"
    description = "A Software Engineer’s Notebook on Code, Systems, and the Craft of Engineering."
    fontSize = "1.1rem"
    togglePreviousAndNextButtons = true
    displayReadingTime = true
    showBackToTopButton = true
    showPostsOnHomePage = "recent"
    customHeadHTML = '<link rel="stylesheet" href="/css/custom.css">'
    customFooterHTML = '<script src="/js/mailchimp.js"></script>'
    customCommentHTML = '<script src="https://giscus.app/client.js" data-repo="amita-shukla/blog-hugo" data-repo-id="R_kgDOQ2l3iA" data-category="Announcements" data-category-id="DIC_kwDOQ2l3iM4C06I7" data-mapping="pathname" data-strict="0" data-reactions-enabled="1" data-emit-metadata="0" data-input-position="top" data-theme="preferred_color_scheme" data-lang="en" data-loading="lazy" crossorigin="anonymous" async> </script>'

  # Search index settings (layouts/index.searchindex.json). All optional; these are the defaults.
  [params.search]
    types = ["post", "note"]   # page types to index
    minWordLen = 2             # shorter words are not indexed
    minPrefixLen = 3           # query words this long or longer also match as prefixes
    tfCap = 10                 # max times a word counts per field, so repetition can't outweigh a title match
    # stopWords = ["a", "an", "the"]   # replaces the built-in stop-word list
    [params.search.boost]
      title = 10
      tags = 5
      headings = 3
      body = 1
